name: Deploy Keybard (keybard.svalboard.com)

# Production: served by GitHub Pages at the custom domain keybard.svalboard.com
# (set in the repository's Pages settings; a keybard CNAME on svalboard.com
# points at svalboard.github.io). Built for the domain's root with --mode
# svalboard (.env.svalboard).
#
# Full releases deploy production: pushing a v tag (v3, v3.1) that is on main
# builds and deploys it. Merges to main do not deploy anything; prerelease
# x tags go to the bleeding-edge site (next-deploy.yml). The same tag names the
# Keybard Overlay release (keybard-overlay-release.yml) and, for v<N>, the firmware
# release on svalboard/qmk. Tag rules: .github/scripts/release-tag.sh.
#
# To deploy an existing v tag again (for example, to roll back), run this from main:
#
#   gh workflow run svalboard-deploy.yml -R svalboard/keybard -f tag=<v tag>

on:
  push:
    # A glob prefilter; release-tag.sh applies the exact rule.
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag on main to deploy, e.g. v3 or v3.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: svalboard-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'svalboard/keybard'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0
      - name: Only a release (v) tag
        run: bash .github/scripts/release-tag.sh "$RELEASE_TAG" release
      - name: Only deploy what is already on main
        run: bash .github/scripts/on-main.sh "$RELEASE_TAG"
      - id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:svalboard
        env:
          GIT_BRANCH: main
          GIT_SHA: ${{ steps.meta.outputs.sha }}
          GIT_SUBJECT: ${{ steps.meta.outputs.subject }}
      - name: Check version.json names this release
        run: bash .github/scripts/version-file.sh "$RELEASE_TAG" dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Pages replaces the whole site: deploy only from a v tag push (checked in
    # build) or from a manual run on this repository's main.
    if: >-
      github.repository == 'svalboard/keybard' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
